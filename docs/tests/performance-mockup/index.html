/* What the CreaFlow app adds to the copied tellovo.ai app (tellovo-app.css): fonts and links, the account menu,
   the tools bubble, the image inside a post, the generating state, and the phone layout (E15).
   docs/SPEC_APP_DESIGN_TELLOVO.md. */
.ap {
  --font-sans-stack: inherit, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono-stack: inherit, ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: var(--font-sans-stack);
  -webkit-font-smoothing: antialiased;
}
.ap a {
  color: var(--ink);
}
.ap button {
  font-family: inherit;
}
.ap .status.posted {
  color: var(--ink);
}
.ap .status.posted:before {
  background: var(--ink);
  border-color: var(--ink);
}
.ap .status.writing:before {
  border-color: var(--accent);
  border-top-color: transparent;
  animation: ap-spin 0.9s linear infinite;
}
@keyframes ap-spin {
  to {
    transform: rotate(360deg);
  }
}
.ap .wday.writing .snip {
  font-style: italic;
}

/* Account menu */
.ap .me-wrap {
  position: relative;
}
.ap .me-btn {
  width: 100%;
  background: transparent;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  color: inherit;
}
.ap .me-btn:hover,
.ap .me-btn[aria-expanded="true"] {
  background: var(--soft);
}
.ap .menu {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(100% + 8px);
  z-index: 30;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 50px -28px #191a1d80;
  animation: ap-fade 0.2s both;
}
.ap .menu a,
.ap .menu button {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  text-decoration: none;
}
.ap .menu a:hover,
.ap .menu button:hover {
  background: var(--soft);
}
.ap .menu hr {
  border: 0;
  border-top: 1px solid var(--soft);
  margin: 4px 2px;
}
.ap .side-mobile-me {
  display: none;
}

/* Post pane: image, tools */
.ap .post-media {
  position: relative;
  margin: 0 0 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
}
.ap .post-media .frame {
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: var(--soft);
}
.ap .post-media .strip {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ap .post-media .strip .tbtn {
  min-height: 40px;
  width: 40px;
  padding: 0;
  justify-content: center;
  border: 1px solid var(--line);
  background: #fff;
}
.ap .tools-wrap {
  position: relative;
}
.ap .bubble {
  position: absolute;
  right: 0;
  bottom: calc(100% + 10px);
  z-index: 25;
  width: min(300px, calc(100vw - 32px));
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 30px 60px -30px #191a1d99;
  animation: ap-fade 0.2s both;
  display: flex;
  flex-direction: column;
}
.ap .bubble h3 {
  font-size: 12px;
  font-weight: 560;
  letter-spacing: 0.02em;
  color: var(--mute);
  padding: 8px 10px 4px;
}
.ap .bubble button {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.ap .bubble button:hover {
  background: var(--soft);
}
.ap .bubble button.danger {
  color: #b3261e;
}
.ap .bubble button:disabled {
  opacity: 0.5;
  cursor: default;
}
.ap .bubble hr {
  border: 0;
  border-top: 1px solid var(--soft);
  margin: 4px 2px;
}
.ap .empty-pane {
  padding: 48px 34px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}
.ap .empty-pane h2 {
  letter-spacing: -0.04em;
  font-size: clamp(22px, 2.1vw, 28px);
  font-weight: 600;
  line-height: 1.15;
}
.ap .empty-pane p {
  color: var(--mute);
  max-width: 52ch;
}
.ap .pane-note {
  color: var(--mute);
  font-size: 13px;
  padding: 0 34px 14px;
}
.ap .err {
  color: #b3261e;
  font-size: 13.5px;
}
.ap .pane-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
  color: var(--accent);
  font-size: 13.5px;
}
.ap .wk-nav {
  display: inline-flex;
  gap: 2px;
  margin-left: 6px;
  vertical-align: middle;
}
.ap .wk-nav .xbtn {
  width: 28px;
  height: 28px;
}
.ap .series-tag {
  color: var(--mute);
  font-size: 12.5px;
}
.ap .modal-wide {
  width: min(980px, 100%);
  padding: 22px;
}
.ap .day-short {
  display: none;
}

/* Visual picker of the tools bubble */
.ap .visual-step {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 12px 8px;
  font-size: 14px;
}
.ap .visual-step input {
  width: 72px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 10px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}

/* A long action (visual, another idea) told on the pane */
.ap .ai-note.working {
  margin: 0 0 16px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fcfbf9;
  color: var(--ink);
}
.ap .ai-note.working .status {
  margin-right: 2px;
}
.ap .composing {
  width: 100%;
  aspect-ratio: 4 / 5;
  max-height: 420px;
  background: linear-gradient(100deg, var(--soft) 30%, #fff 50%, var(--soft) 70%);
  background-size: 200% 100%;
  animation: ap-shimmer 1.4s linear infinite;
}
@keyframes ap-shimmer {
  to {
    background-position: -200% 0;
  }
}

/* The animation of a post: a sealed iframe, scaled to its frame */
.ap .anim-wrap {
  grid-template-columns: minmax(0, 1fr);
}
.ap .anim-wrap .frame {
  width: min(340px, 100%);
  margin: 0 auto;
  background: #000;
}
.ap .anim {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000;
}
.ap .anim iframe {
  position: absolute;
  left: 0;
  top: 0;
  border: 0;
  transform-origin: 0 0;
}
.ap .anim-toggle {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  cursor: pointer;
}
.ap .anim-toggle:hover {
  background: rgba(0, 0, 0, 0.75);
}

/* The plan shows the seven days of a week (a series can publish on the weekend). */
.ap .slots.seven {
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
@media (max-width: 900px) {
  .ap .slots.seven {
    grid-template-columns: repeat(7, minmax(120px, 1fr));
  }
}

/* Phone (E15): the days on top, the script right under, the actions as icons */
@media (max-width: 900px) {
  .ap .side {
    min-width: 0;
    max-width: 100%;
  }
  /* Top bar: the logo and the account on one row, the menu entries scrolling under them. */
  .ap .side-top {
    order: 1;
    flex: 1;
  }
  .ap .side-mobile-me {
    display: inline-flex;
    order: 2;
  }
  .ap .side-nav {
    order: 3;
    width: 100%;
    flex-basis: 100%;
  }
  .ap .menu.menu-top {
    top: calc(100% + 6px);
    bottom: auto;
    left: auto;
    right: 0;
    width: 220px;
  }
  .ap .me-wrap-m {
    position: relative;
  }
}
@media (max-width: 640px) {
  .ap .main {
    padding: 14px 14px 70px;
  }
  .ap .vh {
    margin-bottom: 14px;
    gap: 10px;
  }
  .ap .vt {
    font-size: 26px;
  }
  .ap .vs {
    display: none;
  }
  .ap .vh .btn {
    min-height: 40px;
    font-size: 14px;
  }
  .ap .welcome {
    margin-bottom: 14px;
    padding: 10px 10px 10px 14px;
  }
  .ap .wk-grid {
    gap: 12px;
  }
  /* The days as a row of pills; the script follows at once. */
  .ap .list {
    display: flex;
    flex-direction: row;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .ap .list .wday {
    flex: 1 0 auto;
    min-width: 92px;
    width: auto;
    padding: 9px 12px;
    gap: 2px;
    border-radius: 14px;
    align-items: flex-start;
  }
  .ap .list .wday b,
  .ap .list .wday .snip {
    display: none;
  }
  .ap .list .wday .day-short {
    display: block;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
  }
  .ap .list .wday .wday-top {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .ap .list .wday .wday-top > span:first-child {
    display: none;
  }
  .ap .list .next {
    display: none;
  }
  .ap .pane {
    border-radius: 18px;
  }
  .ap .pane-head {
    padding: 8px 10px 8px 14px;
  }
  .ap .pane-head .when {
    display: none;
  }
  .ap .pane-body {
    padding: 16px 14px 10px;
  }
  .ap .pane-title {
    font-size: 20px;
    margin-bottom: 12px !important;
  }
  .ap .author {
    margin-bottom: 10px;
  }
  .ap .post-text {
    font-size: 15.5px;
  }
  .ap .ai {
    margin: 0 12px 12px;
    padding: 12px;
  }
  .ap .ai .chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ap .ai .chip {
    flex: none;
  }
  /* Actions: the words go, the icons stay. */
  .ap .pane-acts {
    gap: 2px;
    padding: 8px 10px;
  }
  .ap .pane-acts .tbtn {
    padding: 0 10px;
  }
  .ap .pane-acts .tbtn .lbl {
    display: none;
  }
  .ap .pane-acts .main-act {
    flex: none;
    margin: 0 0 0 auto;
  }
  .ap .bubble {
    right: -4px;
  }
  .ap .post-media {
    grid-template-columns: 1fr;
  }
  .ap .post-media .strip {
    flex-direction: row;
  }
  .ap .empty-pane {
    padding: 28px 16px;
  }
  .ap .pane-note {
    padding: 0 14px 12px;
  }
}

body{margin:0}
.ap{--font-mono-stack:ui-monospace,SFMono-Regular,Menlo,monospace;--font-sans-stack:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-family:var(--font-sans-stack);--good:#2f7d5b;--goodbg:#e4f3ec;--bad:#a4503f;--badbg:#f6e7e2}
/* ---- Performance (maquette) : 3 niveaux d'importance ---- */
.pf-sample{font-size:12px;background:#fff8e5;border:1px solid #f0e0a8;color:#7a6320;border-radius:10px;padding:8px 12px;margin:0 0 16px}
.pf-card{background:#fff;border:1px solid var(--line);border-radius:20px}
.pf-wknav{display:inline-flex;align-items:center;gap:6px;margin-left:10px;vertical-align:middle}
.pf-wknav .xbtn:disabled{opacity:.35;cursor:default}

/* NIVEAU 1 — le héros */
.pf-top{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;margin-bottom:34px}
.pf-hero{padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:stretch}
.pf-hero .kick{font-size:13.5px;color:var(--mute)}
.pf-big{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px;flex-wrap:wrap}
.pf-big b{font-size:clamp(52px,6vw,76px);letter-spacing:-.055em;font-weight:620;line-height:1}
.pf-pill{font-size:19px;font-weight:700;letter-spacing:-.02em;border-radius:999px;padding:5px 15px;background:var(--goodbg);color:var(--good);align-self:center}
.pf-pill.dn{background:var(--badbg);color:var(--bad)}
.pf-split{font-size:14px;color:var(--mute)}
.pf-split b{color:var(--ink);font-weight:600}
/* niveau 2 : trois chiffres, simples, sans boîtes */
.pf-sec{display:flex;gap:0;margin-top:26px;padding-top:18px;border-top:1px solid var(--soft)}
.pf-sec > div{flex:1;padding-right:14px}
.pf-sec > div + div{padding-left:18px;border-left:1px solid var(--soft)}
.pf-sec .k{margin-bottom:2px}
.pf-sec b{font-size:24px;letter-spacing:-.03em;font-weight:620;line-height:1.2}
.pf-sec .d{font-size:12px;margin-left:6px;color:var(--good);font-weight:600}
.pf-sec .d.dn{color:var(--bad)}
/* graphique : 4 barres, la semaine choisie en couleur */
.pf-chart{display:flex;flex-direction:column;justify-content:flex-end;min-height:210px}
.pf-chart .cap{font-size:12.5px;color:var(--mute);margin-bottom:auto}
.pf-bars{display:flex;align-items:flex-end;gap:12px;height:150px}
.pf-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.pf-bar .v{font-size:12.5px;color:var(--mute);text-align:center;margin-bottom:6px;font-variant-numeric:tabular-nums}
.pf-bar i{display:block;border-radius:8px 8px 3px 3px;background:#dedbd4;transition:background .2s}
.pf-bar:hover i{background:#c9c6bf}
.pf-bar.cur i{background:var(--accent)}
.pf-bar.cur .v{color:var(--ink);font-weight:600}
.pf-lbl{display:flex;gap:12px;margin-top:8px}
.pf-lbl span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.pf-lbl span.cur{color:var(--ink);font-weight:600}

/* NIVEAU 1 bis — le meilleur post, mis en avant */
.pf-best{padding:26px;background:oklch(0.55 0.2 292 / .07);border-color:oklch(0.55 0.2 292 / .28);display:flex;flex-direction:column}
.pf-best .kick{font-size:13.5px;color:oklch(0.47 0.2 292);font-weight:600;display:flex;align-items:center;gap:7px}
.pf-best h2{font-size:20px;letter-spacing:-.025em;line-height:1.28;font-weight:610;margin:10px 0 18px}
.pf-best .nets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.pf-best .nets div{background:#fff;border-radius:12px;padding:11px 14px}
.pf-best .nets .k{font-size:12px;display:block}
.pf-best .nets b{font-size:22px;letter-spacing:-.03em;font-weight:620}
.pf-best .why{font-size:13.5px;color:var(--mute);margin-top:12px}

/* NIVEAU 3 — les posts, calmes */
.pf-sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:6px;display:flex;align-items:center;gap:12px;font-size:14px}
.pf-sticky b{font-weight:600}

.pf-list{padding:6px 24px 10px}
.pf-wk{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--mute);padding:20px 0 8px;scroll-margin-top:70px}
.pf-wk:first-child{padding-top:14px}
.pf-wk b{color:var(--ink);font-size:14px;font-weight:600}
.pf-wk.cur b{color:var(--accent)}
.pf-wk .t{margin-left:auto}
.pf-colh{display:grid;grid-template-columns:46px minmax(0,1fr) 168px 168px;gap:0 18px;font-size:11.5px;color:var(--mute);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.pf-colh span:nth-child(n+3){text-align:right}
.pf-tr{display:grid;grid-template-columns:46px minmax(0,1fr) 168px 168px;gap:0 18px;align-items:center;padding:14px 0;border-top:1px solid var(--soft);color:inherit;text-decoration:none}
.pf-wk + .pf-tr{border-top:0}
.pf-tr:hover{background:var(--bg);margin:0 -12px;padding-left:12px;padding-right:12px}
.pf-tr .dt{font-size:13px;color:var(--mute)}
.pf-tr .ti{font-size:15.5px;font-weight:580;letter-spacing:-.015em;line-height:1.35}
.pf-tr .ti em[hidden]{display:none}
.pf-tr .ti em{font-style:normal;font-size:11.5px;font-weight:600;color:oklch(0.47 0.2 292);background:oklch(0.55 0.2 292 / .12);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.pf-tr .net{text-align:right}
.pf-tr .net b{font-size:19px;letter-spacing:-.03em;font-weight:620;display:block;line-height:1.2}
.pf-tr .net small{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pf-tr{transition:opacity .25s}.lg{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.pf-colh .lg{width:16px;height:16px}
.pf-tr .net .lg{display:none;width:15px;height:15px;margin-right:6px}
.pf-date{width:46px;height:50px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pf-date b{font-size:19px;letter-spacing:-.03em;font-weight:650}
.pf-date span{font-size:10.5px;color:var(--mute);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.pf-em{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;margin-left:12px}
.pf-em .ico{width:14px;height:14px}
.pf-sec .k{display:flex;align-items:center;color:var(--mute)}
.pf-sec .k .ico{width:19px;height:19px}
.pf-hero .kick{display:flex;align-items:center;gap:7px}
.pf-hero .kick .ico{width:16px;height:16px}
.pf-best .why{display:flex;align-items:center;gap:6px}
.pf-best .why .ico{width:14px;height:14px}
.pf-faded{opacity:.45}.pf-faded:hover{opacity:1}
@media(max-width:1000px){
  .pf-top{grid-template-columns:1fr}
  .pf-hero{grid-template-columns:1fr}
  .pf-colh{display:none}
  .pf-tr{grid-template-columns:1fr 1fr;gap:6px 12px}
  .pf-tr .dt,.pf-tr .ti{grid-column:1 / -1}
  .pf-tr .net{text-align:left}.pf-tr .net .lg{display:inline-block}
}
</style>
</head>
<body>
<div class="ap">
<div class="shell">
  <aside class="side" aria-label="Workspace">
    <div class="side-top"><span class="wm">tellovo<i aria-hidden="true"></i></span></div>
    <div class="ws">
      <span class="logo" aria-hidden="true">MK</span>
      <span style="min-width:0"><b>MyKiné</b><span>akralan/mykine</span></span>
    </div>
    <nav class="side-nav" aria-label="Main">
      <a class="nv" href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>This week <span class="badge">3/3</span></a>
      <a class="nv" href="#"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Content plan</a>
      <a class="nv" href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Business context</a>
      <a class="nv on" href="#" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>Performance</a>
    </nav>
    <div class="side-bottom">
      <div class="plan-card"><b>Free plan</b><div class="meter" aria-hidden="true"><i style="width:50%"></i></div><p>Your first week is on us. 1 of 2 free weeks used.</p><button class="btn btn-ink btn-sm btn-block" type="button">Upgrade</button></div>
      <div class="me-wrap"><button class="me me-btn" type="button"><span class="av" aria-hidden="true">AL</span><span style="min-width:0"><b>Alix</b><span>alix@mykine.app</span></span></button></div>
    </div>
  </aside>
  <main class="main"><div class="main-in">

    <header class="vh">
      <div>
        <p class="vk">Performance
          <span class="pf-wknav">
            <button class="xbtn" type="button" id="prev" aria-label="Previous week"><span aria-hidden="true">‹</span></button>
            <button class="xbtn" type="button" id="next" aria-label="Next week"><span aria-hidden="true">›</span></button>
          </span>
        </p>
        <h1 class="vt" id="headline"></h1>
        <p class="vs" id="sub"></p>
      </div>
    </header>

    <section class="pf-top">
      <div class="pf-card pf-hero" id="hero"></div>
      <div class="pf-card pf-best" id="best"></div>
    </section>

    <div class="pf-sticky"><b id="sk-range"></b><span id="sk-name" class="k"></span></div>
    <section class="pf-card pf-list" id="list"></section>

  </div></main>
</div>
</div>

<script>
// [impressions, likes, comments, shares]
const POSTS = [
  { id:1,  date:"2026-09-21", day:"Mon", title:"6 in 10 patients don't do their exercises at home", wk:0, li:[820,21,5,2], x:[310,6,1,1]},
  { id:2,  date:"2026-09-23", day:"Wed", title:"I'm building a rep counter for physios, nights and weekends", wk:0, li:[1150,30,8,3], x:[420,9,2,2]},
  { id:3,  date:"2026-09-25", day:"Fri", title:"A squat is three joints: hip, knee, ankle", wk:0, li:[980,24,4,2], x:[380,8,1,1]},
  { id:4,  date:"2026-09-28", day:"Mon", title:"The laptop lied by omission: 1 rep in 3 missed on an iPhone 11", wk:1, li:[2650,121,29,14], x:[990,38,7,9]},
  { id:5,  date:"2026-09-30", day:"Wed", title:"The VPS was in the camera path", wk:1, li:[1620,38,8,3], x:[560,12,2,2]},
  { id:6,  date:"2026-10-02", day:"Fri", title:"Moving the model onto the phone", wk:1, li:[1910,52,11,6], x:[690,15,3,3]},
  { id:7,  date:"2026-10-05", day:"Mon", title:"33 keypoints, and not one frame leaves the phone", wk:2, li:[3050,102,27,15], x:[1120,31,6,9]},
  { id:8,  date:"2026-10-07", day:"Wed", title:"A patient with no account: one SMS, six letters", wk:2, li:[2240,64,13,6], x:[830,19,3,2]},
  { id:9,  date:"2026-10-09", day:"Fri", title:"What the physio actually reads on the dashboard", wk:2, li:[2780,88,19,8], x:[960,25,5,4]},
  { id:10, date:"2026-10-12", day:"Mon", title:"Julien tests it with 20 squats in his living room", wk:3, li:[3900,141,34,19], x:[1480,44,9,11]},
  { id:11, date:"2026-10-14", day:"Wed", title:"Why the app never says “good job” on a bad squat", wk:3, li:[3320,97,22,10], x:[1210,29,6,5]},
  { id:12, date:"2026-10-16", day:"Fri", title:"One month in public: what I'd do differently", wk:3, li:[4560,172,46,24], x:[1740,52,11,14]},
];
const WEEKS = ["Sep 21 – 27","Sep 28 – Oct 4","Oct 5 – 11","Oct 12 – 18"];
const SHORT = ["Sep 21","Sep 28","Oct 5","Oct 12"];
const MONTHS = {"09":"Sep","10":"Oct"};
const IC = {
  like:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 6.1-8 11-8 11z"/></svg>',
  comment:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
  share:'<svg class="ico" viewBox="0 0 24 24"><path d="m17 3 4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="m7 21-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg>',
  eye:'<svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};
const LOGO = {
  li:'<svg class="lg" viewBox="0 0 24 24" aria-label="LinkedIn"><path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
  x:'<svg class="lg" viewBox="0 0 24 24" aria-label="X"><path fill="#191a1d" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>'
};
const fmt = n => n>=1000 ? (n/1000).toFixed(n>=10000?1:1).replace(".0","")+"k" : String(n);
const both = (p,i)=>p.li[i]+p.x[i];
const impSorted = POSTS.map(p=>both(p,0)).sort((a,b)=>a-b);
const median = (impSorted[5]+impSorted[6])/2;
const last = WEEKS.length-1;
let wk = last;

const bestOfWeek = w => weekPosts(w).slice().sort((a,b)=>both(b,0)-both(a,0))[0];
const weekPosts = w => POSTS.filter(p=>p.wk===w);
const totals = w => [0,1,2,3].map(i=>weekPosts(w).reduce((a,p)=>a+both(p,i),0));
const netTotal = (w,k) => weekPosts(w).reduce((a,p)=>a+p[k][0],0);
const weekName = w => w===last ? "This week" : w===last-1 ? "Last week" : (last-w)+" weeks ago";
const delta = (c,p)=>Math.round((c/p-1)*100);
const pill = (v,cls="pf-pill")=>`<span class="${cls} ${v<0?'dn':''}">${v>=0?'▲':'▼'} ${v>=0?'+':''}${v}%</span>`;
const dayLabel = p => p.day+" "+(+p.date.slice(8));

function render(){
  const cur=totals(wk), prev=wk>0?totals(wk-1):null;
  const d=prev?delta(cur[0],prev[0]):null;
  // titre : une phrase qui dit tout
  document.getElementById("headline").textContent = d===null ? "Your first week." : d>=0 ? (wk===last?"You're growing.":"That week was up.") : "A quieter week.";
  document.getElementById("sub").textContent = (wk===last?"This week":"Week of "+WEEKS[wk])+", "+weekPosts(wk).length+" posts reached "+fmt(cur[0])+" people on LinkedIn and X"+(d!==null?(d>=0?", "+d+"% more than the week before.":", "+(-d)+"% fewer than the week before."):".");

  // HÉROS
  const bars = [0,1,2,3].map(w=>totals(w)[0]);
  const bmax = Math.max(...bars);
  const second = [[IC.like,"Likes",1],[IC.comment,"Comments",2],[IC.share,"Shares",3]].map(([e,n,i])=>`<div><span class="k" title="${n}">${e}</span><b>${fmt(cur[i])}</b>${prev?`<span class="d ${delta(cur[i],prev[i])<0?'dn':''}">${delta(cur[i],prev[i])>=0?'+':''}${delta(cur[i],prev[i])}%</span>`:''}</div>`).join("");
  document.getElementById("hero").innerHTML = `
    <div>
      <div class="kick">${IC.eye} Impressions · ${weekName(wk).toLowerCase()}</div>
      <div class="pf-big"><b>${fmt(cur[0])}</b>${d!==null?pill(d):''}</div>
      <div class="pf-split"><b>${fmt(netTotal(wk,'li'))}</b> on LinkedIn · <b>${fmt(netTotal(wk,'x'))}</b> on X</div>
      <div class="pf-sec">${second}</div>
    </div>
    <div class="pf-chart">
      <div class="cap">Impressions per week</div>
      <div class="pf-bars">${bars.map((v,w)=>`<button class="pf-bar ${w===wk?'cur':''}" data-w="${w}" aria-label="${WEEKS[w]}: ${v} impressions"><span class="v">${fmt(v)}</span><i style="height:${Math.max(8,v/bmax*112)}px"></i></button>`).join("")}</div>
      <div class="pf-lbl">${SHORT.map((s,w)=>`<span class="${w===wk?'cur':''}">${s}</span>`).join("")}</div>
    </div>`;

  // MEILLEUR POST
  const best = weekPosts(wk).slice().sort((a,b)=>both(b,0)-both(a,0))[0];
  const ratio = (both(best,0)/median).toFixed(1);
  document.getElementById("best").innerHTML = `
    <div class="kick"><svg class="ico" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Best post ${wk===last?'this week':'of the week'}</div>
    <h2>${best.title}</h2>
    <div class="nets"><div><span class="k">${LOGO.li}</span><b>${fmt(best.li[0])}</b></div><div><span class="k">${LOGO.x}</span><b>${fmt(best.x[0])}</b></div></div>
    <p class="why">${ratio}× your usual reach · ${IC.like} ${best.li[1]+best.x[1]}</p>`;

  // barre collante
  document.getElementById("sk-range").textContent = "Week of "+WEEKS[wk];
  document.getElementById("sk-name").textContent = weekName(wk);
  document.getElementById("prev").disabled = wk===0;
  document.getElementById("next").disabled = wk===last;

  document.querySelectorAll(".pf-bar").forEach(b=>b.onclick=()=>go(+b.dataset.w));
  document.querySelectorAll(".pf-wk").forEach(el=>el.classList.toggle("cur",+el.dataset.w===wk));
  const bid=bestOfWeek(wk).id;
  document.querySelectorAll(".pf-tr").forEach(el=>{el.querySelector("em").hidden=+el.dataset.id!==bid;});
  document.querySelectorAll(".pf-tr").forEach(el=>el.classList.toggle("pf-faded",+el.dataset.w!==wk));
}

function renderList(){
  let h=`<div class="pf-colh"><span></span><span></span><span>${LOGO.li}</span><span>${LOGO.x}</span></div>`;
  for(let w=last; w>=0; w--){
    h+=`<div class="pf-wk" data-w="${w}"><b>${WEEKS[w]}</b>${weekName(w)}</div>`;
    h+=weekPosts(w).slice().reverse().map(p=>{
            const net=k=>`<div class="net"><b>${LOGO[k]}${fmt(p[k][0])}</b><small><span class="pf-em" title="Likes">${IC.like}${p[k][1]}</span><span class="pf-em" title="Comments">${IC.comment}${p[k][2]}</span><span class="pf-em" title="Shares">${IC.share}${p[k][3]}</span></small></div>`;
      return `<a class="pf-tr" data-w="${w}" data-id="${p.id}" href="#"><span class="pf-date"><b>${+p.date.slice(8)}</b><span>${p.day}</span></span><span class="ti">${p.title}<em hidden>Best post</em></span>${net('li')}${net('x')}</a>`;
    }).join("");
  }
  document.getElementById("list").innerHTML=h;
}
function go(w){ wk=w; render(); }
function observe(){
  const io=new IntersectionObserver(es=>{
    es.forEach(en=>{ if(en.isIntersecting){ const w=+en.target.dataset.w; if(w!==wk){wk=w;render();} } });
  },{rootMargin:"-12% 0px -80% 0px"});
  document.querySelectorAll(".pf-wk").forEach(el=>io.observe(el));
}
document.getElementById("prev").onclick=()=>{wk--;render();};
document.getElementById("next").onclick=()=>{wk++;render();};
renderList(); render(); observe();
</script>
</body>
</html>
